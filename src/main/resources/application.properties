spring.application.name=mapNotifier

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/google_map_notifier
spring.datasource.username=gmn_user
spring.datasource.password=gmn_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

eta.provider=mock
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.routes-url=https://routes.googleapis.com/directions/v2:computeRoutes